<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ material.title }} | Інтерактивний конспект</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #2c3e50;
            display: flex;
            flex-direction: column;
            font-family: sans-serif;
            overflow: hidden; /* Забороняємо прокрутку основної сторінки, крутитися буде лише презентація */
        }

        /* Верхня панель (Header) */
        .reader-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: #1a252f;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            z-index: 10;
        }

        .btn-back, .btn-download {
            padding: 10px 15px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            font-size: 14px;
            transition: background-color 0.2s;
            white-space: nowrap;
        }

        .btn-back {
            background-color: #344e86;
            color: white;
            border: 1px solid #344e86;
        }

        .btn-back:hover {
            background-color: #2a3f6e;
        }

        .btn-download {
            background-color: #ffcc00;
            color: #344e86;
        }

        .btn-download:hover {
            background-color: #e6b800;
        }

        .header-title {
            color: white;
            font-weight: bold;
            font-size: 16px;
            text-align: center;
            flex-grow: 1;
            margin: 0 15px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Контейнер для презентації */
        .iframe-container {
            flex-grow: 1;
            width: 100%;
            background-color: #ffffff;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* Мобільна адаптація */
        @media (max-width: 600px) {
            .header-title { display: none; } /* На телефонах ховаємо назву, щоб влізли обидві кнопки */
            .reader-header { padding: 15px 10px; }
        }

        @media print {
            body { display: none !important; }
        }
    </style>
</head>
<!-- Заборона правої кнопки миші -->
<body oncontextmenu="return false;">

    <div class="reader-header">
        <a href="{% url 'cabinet' %}" class="btn-back">⬅ В кабінет</a>
        <div class="header-title">{{ material.title }}</div>

        <!-- Кнопка завантаження PDF -->
        {% if material.file %}
            <a href="{{ material.file.url }}" target="_blank" download class="btn-download">📥 Завантажити PDF</a>
        {% endif %}
    </div>

    <div class="iframe-container">
        <!-- Вікно для ізольованого відображення HTML-коду -->
        <iframe id="presentation-frame" sandbox="allow-scripts allow-same-origin"></iframe>
    </div>
<!-- Безпечне передавання HTML-коду у JavaScript -->
    {{ material.html_content|default_if_none:""|json_script:"html-data" }}

    <script>
        // Блокуємо спроби зберегти сторінку клавіатурою
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && (e.key === 's' || e.key === 'p' || e.key === 'c')) {
                e.preventDefault();
            }
        });

        // 1. Безпечно дістаємо HTML-код із бази
        const htmlContent = JSON.parse(document.getElementById('html-data').textContent);
        const iframe = document.getElementById('presentation-frame');

        // 2. Якщо код є - відмальовуємо його через надійний srcdoc
        if (htmlContent && htmlContent.trim() !== "") {
            iframe.srcdoc = htmlContent;
        } else {
            // Якщо пусто - показуємо повідомлення-заглушку
            iframe.srcdoc = `
                <div style="display: flex; justify-content: center; align-items: center; height: 100%; font-family: sans-serif; color: #666; background-color: #f9f9f9; text-align: center; padding: 20px;">
                    <h2>Інтерактивна презентація ще не додана.<br>Будь ласка, скористайтеся завантаженням PDF.</h2>
                </div>
            `;
        }
    </script>
</body>
</html>
