{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <!-- Блокуємо зум, щоб інтерфейс відчувався як мобільний додаток -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{{ material.title }} | Інтерактивний конспект</title>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #2c3e50;
            display: flex;
            flex-direction: column;
            font-family: sans-serif;
            overflow: hidden; /* Забороняємо прокрутку сторінки, крутитись має тільки сама презентація */
        }

        /* КОМПАКТНА ШАПКА ДЛЯ ТЕЛЕФОНІВ ТА ПК */
        .reader-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            height: 60px;
            background-color: #1a252f;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            z-index: 10;
        }

        .header-left, .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-back {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            background-color: #344e86;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: bold;
            transition: 0.2s;
        }
        .btn-back:hover { background-color: #2a3f6e; }

        .header-title {
            color: white;
            font-weight: bold;
            font-size: 15px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 300px;
        }

        .action-btn {
            padding: 8px 12px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            font-size: 13px;
            text-transform: uppercase;
            transition: 0.2s;
            white-space: nowrap;
        }

        .btn-practice {
            background-color: #ff9f43;
            color: #fff;
            border: 2px solid #e67e22;
        }
        .btn-practice:hover { background-color: #e67e22; }

        .btn-download {
            background-color: #344e86;
            color: white;
            border: 2px solid #2a3f6e;
        }
        .btn-download:hover { background-color: #2a3f6e; }

        /* КОНТЕЙНЕР ПРЕЗЕНТАЦІЇ */
        .iframe-container {
            flex-grow: 1;
            width: 100%;
            height: calc(100vh - 60px);
            background-color: #ffffff;
            position: relative;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* ПЛАВАЮЧА ПАНЕЛЬ УПРАВЛІННЯ (Вниз екрану) */
        .mobile-controls {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(26, 37, 47, 0.95);
            padding: 8px 25px;
            border-radius: 40px;
            display: flex;
            gap: 25px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            z-index: 2000;
            backdrop-filter: blur(10px);
            border: 2px solid #ff9f43;
            align-items: center;
        }

        .control-btn {
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
            padding: 5px;
        }

        .control-btn:active {
            transform: scale(0.8);
        }

        /* Адаптація під телефони */
        @media (max-width: 600px) {
            .header-title { display: none; } /* Ховаємо назву, щоб влізли кнопки */
            .action-btn span { display: none; } /* Ховаємо текст кнопок, лишаємо емодзі/іконки */
            .action-btn { font-size: 1.2rem; padding: 6px 10px; }
            .btn-practice::after { content: "🎯"; }
            .btn-download::after { content: "📥"; }
        }

        @media print {
            body { display: none !important; }
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <!-- Компактна шапка -->
    <div class="reader-header" id="reader-header">
        <div class="header-left">
            <a href="{% url 'cabinet' %}" class="btn-back" title="В кабінет">⬅</a>
            <div class="header-title">{{ material.title }}</div>
        </div>
        <div class="header-right">
            <!-- Кнопка Практики -->
            <a href="{% url 'practice_session' material.id %}" class="action-btn btn-practice"><span>🎯 Практика НМТ</span></a>

            <!-- Кнопка завантаження PDF -->
            {% if material.file %}
                <a href="{{ material.file.url }}" target="_blank" download class="action-btn btn-download"><span>📥 PDF</span></a>
            {% endif %}
        </div>
    </div>

    <!-- Область презентації -->
    <div class="iframe-container" id="presentation-container">
        <iframe id="presentation-frame" sandbox="allow-scripts allow-same-origin" allowfullscreen></iframe>
    </div>

    <!-- Плаваюча панель (Стрілки + Фулскрін) -->
    <div class="mobile-controls" id="mobile-controls">
        <button class="control-btn" onclick="navigateSlide('prev')" title="Назад">◀</button>
        <button class="control-btn" onclick="toggleFullScreen()" title="Повний екран" style="color: #ff9f43; font-size: 1.8rem; padding: 0 10px;">⛶</button>
        <button class="control-btn" onclick="navigateSlide('next')" title="Вперед">▶</button>
    </div>

    <!-- Безпечне передавання HTML-коду у JavaScript -->
    {{ material.html_content|default_if_none:""|json_script:"html-data" }}

    <script>
        // Блокуємо спроби зберегти сторінку клавіатурою
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && (e.key === 's' || e.key === 'p' || e.key === 'c')) {
                e.preventDefault();
            }
        });

        // 1. Безпечно дістаємо HTML-код із бази
        let htmlContent = JSON.parse(document.getElementById('html-data').textContent);
        const iframe = document.getElementById('presentation-frame');

        // 2. Якщо код є - відмальовуємо його
        if (htmlContent && htmlContent.trim() !== "") {
            // Вшиваємо стилі прямо в код презентації
            const customStyles = `
                <style>
                    /* Ховаємо текст, зміну теми ТА ЗЕЛЕНУ КНОПКУ ФУЛСКРІНУ всередині HTML */
                    .brand-logo-container, #btn-theme, #btn-fullscreen, .btn-fullscreen, .fullscreen-btn { display: none !important; }
                    .navbar {
                        position: absolute !important;
                        top: 15px !important;
                        right: 25px !important;
                        background: transparent !important;
                        border: none !important;
                        box-shadow: none !important;
                        height: auto !important;
                        padding: 0 !important;
                        z-index: 1000 !important;
                    }
                    /* ДОДАЄМО ПУСТИЙ ПРОСТІР ЗНИЗУ (БУФЕРНА ЗОНА ДЛЯ ПАНЕЛІ) */
                    .presentation-viewport {
                        height: 100vh !important;
                        max-height: 100vh !important;
                        padding-bottom: 100px !important;
                        box-sizing: border-box !important;
                    }
                    body {
                        margin: 0;
                        padding: 0;
                        padding-bottom: 100px !important;
                    }
                    /* Робимо так, щоб презентація тягнулась на всю висоту */
                    .presentation-viewport { height: 100vh !important; max-height: 100vh !important; }
                    body { margin: 0; padding: 0; overflow: hidden; }
                </style>
            </head>`;

            htmlContent = htmlContent.replace('</head>', customStyles);
            iframe.srcdoc = htmlContent;
        } else {
            iframe.srcdoc = `
                <div style="display: flex; justify-content: center; align-items: center; height: 100%; font-family: sans-serif; color: #666; background-color: #f9f9f9; text-align: center; padding: 20px;">
                    <h2>Інтерактивна презентація ще не додана.<br>Будь ласка, скористайтеся завантаженням PDF.</h2>
                </div>
            `;
        }

        // --- 3. ЛОГІКА ПОВНОЕКРАННОГО РЕЖИМУ ---
        function toggleFullScreen() {
            let elem = document.documentElement;

            if (!document.fullscreenElement) {
                if (elem.requestFullscreen) { elem.requestFullscreen(); }
                else if (elem.webkitRequestFullscreen) { elem.webkitRequestFullscreen(); }
                else if (elem.msRequestFullscreen) { elem.msRequestFullscreen(); }

                // Ховаємо верхню шапку, розтягуємо контейнер
                document.getElementById('reader-header').style.display = 'none';
                document.getElementById('presentation-container').style.height = '100vh';
            } else {
                if (document.exitFullscreen) { document.exitFullscreen(); }
                else if (document.webkitExitFullscreen) { document.webkitExitFullscreen(); }

                // Повертаємо шапку назад
                document.getElementById('reader-header').style.display = 'flex';
                document.getElementById('presentation-container').style.height = 'calc(100vh - 60px)';
            }
        }

        // --- 4. ЛОГІКА КНОПОК ВПЕРЕД / НАЗАД (СИМУЛЯЦІЯ КЛАВІАТУРИ) ---
        function navigateSlide(direction) {
            if (!iframe || !iframe.contentWindow) return;

            try {
                const key = direction === 'next' ? 'ArrowRight' : 'ArrowLeft';
                const keyCode = direction === 'next' ? 39 : 37;

                const event = new KeyboardEvent('keydown', {
                    key: key,
                    code: key,
                    keyCode: keyCode,
                    which: keyCode,
                    bubbles: true
                });

                iframe.contentWindow.document.dispatchEvent(event);
            } catch (e) {
                console.warn("Помилка навігації:", e);
            }
        }
    </script>
</body>
</html>
