<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{SUBJECT}}: {{TITLE}} | ДО КВАДРАТУ</title>
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']], processEscapes: true },
            svg: { fontCache: 'global' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.js" id="MathJax-script" async></script>
    <style>
        :root { --brand-blue: #344e86; --brand-green: #27ae60; --brand-yellow: #f39c12; --text-dark: #2c3e50; --text-muted: #7f8c8d; --bg-light: #f4f6fa; --card-bg: #ffffff; --border-color: #dce3ec; --shadow: 0 8px 24px rgba(52,78,134,0.08); --font-main: 'Segoe UI', system-ui, sans-serif; --warning-red: #e74c3c; --widget-bg: #eef3f9; --transition: all 0.3s ease; }
        body[data-theme="dark"] { --brand-blue: #6c8dfa; --brand-green: #2ecc71; --brand-yellow: #f1c40f; --text-dark: #ecf0f1; --text-muted: #a0aec0; --bg-light: #151c28; --card-bg: #1f2a3c; --border-color: #31425d; --shadow: 0 8px 30px rgba(0,0,0,0.4); --widget-bg: #182232; }
        * { box-sizing: border-box; }
        html, body { height: 100vh; margin: 0; overflow: hidden; font-family: var(--font-main); background: var(--bg-light); color: var(--text-dark); }
        body { display: flex; flex-direction: column; }

        .navbar { background: var(--card-bg); border-bottom: 3px solid var(--brand-green); padding: 0 25px; display: flex; justify-content: space-between; align-items: center; height: 64px; }
        .brand-logo-container { font-weight: 800; color: var(--text-dark); text-decoration: none; }
        .nav-controls { display: flex; gap: 10px; }
        .btn-primary, .btn-secondary { padding: 7px 15px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.9rem; transition: var(--transition); }
        .btn-primary { background: var(--brand-green); color: #fff; border: none; }
        .btn-secondary { background: transparent; border: 1.5px solid var(--brand-blue); color: var(--text-dark); }
        .progress-container { height: 5px; background: rgba(0,0,0,0.06); }
        .progress-bar { height: 100%; width: 0; background: linear-gradient(90deg, var(--brand-green), var(--brand-yellow)); transition: width 0.3s; }

        .presentation-viewport { flex: 1; overflow: hidden; padding: 20px; display: flex; justify-content: center; }
        .slide-card { display: none; width: 100%; max-width: 1100px; background: var(--card-bg); border-radius: 14px; box-shadow: var(--shadow); padding: 24px 30px; overflow-y: auto; }
        .slide-card.active { display: block; animation: fade 0.3s ease; }
        @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
        .slide-header { margin-bottom: 16px; }
        .slide-tag { display: inline-block; background: var(--widget-bg); color: var(--brand-blue); font-size: 0.75rem; font-weight: 700; text-transform: uppercase; padding: 4px 10px; border-radius: 20px; }
        .slide-title { margin: 8px 0 0; font-size: 1.8rem; color: var(--brand-blue); }
        .slide-body { font-size: 1.1rem; }
        .slide-body p { margin: 8px 0; line-height: 1.55; }

        .box { border-left: 5px solid var(--brand-blue); background: var(--widget-bg); border-radius: 8px; padding: 12px 16px; margin-bottom: 14px; }
        .box-title { font-weight: 700; margin-bottom: 6px; }
        .box.definition { border-color: var(--brand-blue); }
        .box.theorem { border-color: var(--brand-green); }
        .box.example { border-color: #8e44ad; }
        .box.hack { border-color: var(--brand-yellow); }
        .box.remark { border-color: var(--text-muted); }
        .box.error { border-color: var(--warning-red); }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
        .grid-2 > *, .grid-3 > * { min-width: 0; }
        .scrollable-math { overflow-x: auto; overflow-y: hidden; }

        .math-widget { background: var(--widget-bg); border-radius: 10px; padding: 14px; }
        .widget-svg-container svg { width: 100%; max-height: 320px; color: var(--text-dark); }
        .slider-control { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
        .slider-control input[type=range] { flex: 1; accent-color: var(--brand-green); }

        .quiz-option { background: var(--bg-light); border: 2px solid var(--border-color); border-radius: 8px; padding: 8px 15px; margin: 6px 0; cursor: pointer; font-weight: 600; transition: var(--transition); }
        .quiz-option:hover { border-color: var(--brand-blue); }
        .quiz-option.correct { border-color: var(--brand-green); color: var(--brand-green); }
        .quiz-option.wrong { border-color: var(--warning-red); color: var(--warning-red); }
        .quiz-explanation, .quiz-hint { display: none; margin-top: 10px; }

        .controls-footer { height: 64px; padding: 0 25px; display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); border-top: 1px solid var(--border-color); }
        .slide-counter { font-weight: bold; color: var(--brand-blue); }
        .nav-hint { font-size: 0.85rem; color: var(--text-muted); }
        .nav-buttons { display: flex; gap: 10px; }
        kbd { border: 1px solid var(--border-color); border-radius: 4px; padding: 0 5px; background: var(--bg-light); }

        /* Діалог на першому слайді */
        .bubble { background: var(--widget-bg); border: 2px solid var(--border-color); border-radius: 16px; padding: 12px 16px; margin: 10px 0; }
        .bubble.right { border-color: var(--brand-green); margin-left: 12%; }
        .bubble.left { border-color: var(--brand-blue); margin-right: 12%; }
        .who { font-weight: 700; color: var(--brand-blue); }
        .bubble.right .who { color: var(--brand-green); }
        .big-question { font-size: 1.3rem; font-weight: 700; text-align: center; margin-top: 14px; }
        .hidden-answer { display: none; }
        .hidden-answer.shown { display: block; animation: fade 0.3s ease; }

{{CSS}}
        .step-controls { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
        .quiz-q { font-weight: 700; margin-bottom: 4px; }

        @media (max-width: 760px) {
            .grid-2, .grid-3 { grid-template-columns: 1fr; }
            .presentation-viewport { padding: 10px; }
            .slide-card { padding: 16px; }
            .slide-title { font-size: 1.35rem; }
            .slide-body { font-size: 1rem; }
            .nav-hint { display: none; }
            .navbar, .controls-footer { padding: 0 12px; }
            .brand-logo-container { font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 55vw; }
            .btn-primary, .btn-secondary { padding: 6px 10px; }
            .bubble.right { margin-left: 6%; }
            .bubble.left { margin-right: 6%; }
        }
    </style>
</head>
<body>
    <header class="navbar">
        <a href="#" class="brand-logo-container"><span>ДО КВАДРАТУ | {{BRAND}}</span></a>
        <div class="nav-controls">
            <button class="btn-secondary" id="btn-theme">🌓 Тема</button>
            <button class="btn-primary" id="btn-fullscreen">⛶</button>
        </div>
    </header>
    <div class="progress-container"><div class="progress-bar" id="progress-bar"></div></div>

    <main class="presentation-viewport">
{{SLIDES}}
    </main>

    <footer class="controls-footer">
        <div class="slide-counter" id="slide-counter">Слайд 1 з {{TOTAL}}</div>
        <div class="nav-hint">Навігація: <kbd>←</kbd> <kbd>→</kbd> | Повний екран: <kbd>F</kbd></div>
        <div class="nav-buttons">
            <button class="btn-secondary" id="btn-prev">← Назад</button>
            <button class="btn-primary" id="btn-next">Вперед →</button>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const slides = document.querySelectorAll('.slide-card');
            const totalSlides = slides.length;
            let currentSlide = 1;

            window.goToSlide = function (index) {
                currentSlide = Math.min(Math.max(index, 1), totalSlides);
                slides.forEach((s, i) => s.classList.toggle('active', i === currentSlide - 1));
                document.getElementById('slide-counter').textContent = `Слайд ${currentSlide} з ${totalSlides}`;
                document.getElementById('progress-bar').style.width = `${currentSlide / totalSlides * 100}%`;
                document.getElementById('btn-prev').style.opacity = currentSlide === 1 ? '0.5' : '1';
                document.getElementById('btn-next').style.opacity = currentSlide === totalSlides ? '0.5' : '1';

                // Віджети малюються при вході на свій слайд
{{RENDER}}
                if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise();
            };

            document.getElementById('btn-next').addEventListener('click', () => goToSlide(currentSlide + 1));
            document.getElementById('btn-prev').addEventListener('click', () => goToSlide(currentSlide - 1));
            document.getElementById('btn-fullscreen').addEventListener('click', () => {
                if (!document.fullscreenElement) document.documentElement.requestFullscreen();
                else document.exitFullscreen();
            });
            document.getElementById('btn-theme').addEventListener('click', () => {
                const dark = document.body.getAttribute('data-theme') === 'dark';
                document.body.setAttribute('data-theme', dark ? 'light' : 'dark');
            });
            // Обов'язково: кнопки сайту надсилають сюди саме ці клавіші
            document.addEventListener('keydown', (e) => {
                // Стрілки на повзунку змінюють його значення, а не слайд
                if (e.target && e.target.tagName === 'INPUT') return;
                if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); goToSlide(currentSlide + 1); }
                else if (e.key === 'ArrowLeft') goToSlide(currentSlide - 1);
                else if (e.key.toLowerCase() === 'f') document.getElementById('btn-fullscreen').click();
            });

            // Тисячі через вузький нерозривний пробіл: 1 248
            const fmt = (n) => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');

            goToSlide(1);
        });
    </script>
</body>
</html>
