<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #344e86; }
      .main-square { fill: #ffffff; }
      .grid-line { stroke: #344e86; stroke-width: 14; stroke-linecap: square; }
      .math-glyph { fill: none; stroke: #344e86; stroke-width: 16; stroke-linecap: round; stroke-linejoin: round; }
      .math-dot { fill: #344e86; }
      .text-title { font-family: 'Montserrat', sans-serif; font-size: 36px; font-weight: 800; fill: #ffffff; text-anchor: middle; letter-spacing: 2px; }
      .text-subtitle { font-family: 'Montserrat', sans-serif; font-size: 24px; font-weight: 600; fill: #ffcc00; text-anchor: middle; letter-spacing: 1px; }
    </style>
  </defs>

  <!-- Темно-синій фірмовий фон -->
  <rect width="800" height="600" class="bg" />

  <!-- Логотип по центру -->
  <g transform="translate(260, 90)">
    <rect width="280" height="280" rx="20" ry="20" class="main-square" />
    <line x1="140" y1="0" x2="140" y2="280" class="grid-line" />
    <line x1="0" y1="140" x2="280" y2="140" class="grid-line" />
    <g transform="translate(70, 70)">
      <line x1="-24" y1="0" x2="24" y2="0" class="math-glyph" />
      <line x1="0" y1="-24" x2="0" y2="24" class="math-glyph" />
    </g>
    <g transform="translate(210, 70)">
      <line x1="-24" y1="0" x2="24" y2="0" class="math-glyph" />
    </g>
    <g transform="translate(70, 210)">
      <line x1="-18" y1="-18" x2="16" y2="16" class="math-glyph" />
      <line x1="18" y1="-18" x2="-16" y2="16" class="math-glyph" />
    </g>
    <g transform="translate(210, 210)">
      <circle cx="0" cy="-22" r="9" class="math-dot" />
      <circle cx="0" cy="22" r="9" class="math-dot" />
    </g>
  </g>

  <!-- Текст під логотипом -->
  <text x="400" y="460" class="text-title">АВТОРСЬКИЙ КОНСПЕКТ</text>
  <text x="400" y="510" class="text-subtitle">ПРОЄКТ «ДО КВАДРАТУ»</text>
</svg>
