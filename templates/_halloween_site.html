<style>
    .navbar { border-bottom-color: #ff7a00 !important; }
    .nav-logo { position: relative; }
    .nav-logo::after { content: '🎃'; position: absolute; left: -8px; top: -10px; font-size: 18px; transform: rotate(-15deg); pointer-events: none; }
