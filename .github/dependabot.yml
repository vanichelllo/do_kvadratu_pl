# GitHub щотижня перевіряє бібліотеки й пропонує оновлення окремими запитами на об'єднання
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
